name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 6 * * *'

permissions: read-all

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.27'
          # Fixtures under bench/corpus are separate Go modules, so ./... does
          # not include them.
          go-package: ./...

  # The same scan with the Go version go.mod names. That is the oldest
  # toolchain a source install (go install ...@latest) can be built with, so
  # a standard library advisory that only the newest release fixes shows up
  # here and says the go directive has to move.
  govulncheck-go-mod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
