name: govulncheck

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 6 * * *'

permissions: read-all

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.27'
          # Fixtures under bench/corpus are separate Go modules, so ./... does
          # not include them.
          go-package: ./...
