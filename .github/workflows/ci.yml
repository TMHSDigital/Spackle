name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Build (static, no cgo)
        run: go build -trimpath ./...
        env:
          CGO_ENABLED: '0'
      - name: Test with the race detector
        run: go test -race -shuffle=on ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'
      - name: gofmt
        run: test -z "$(gofmt -s -l cmd internal)"
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: Load tool versions
        run: grep -E '^[A-Z_]+=v[0-9.]+$' .github/tool-versions.env >> "$GITHUB_ENV"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  sandbox:
    name: sandbox integration (docker, linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'
      - name: Container runtime
        run: docker version
      # SPACKLE_REQUIRE_RUNTIME turns "skip when no runtime" into a failure,
      # so this job cannot pass by skipping.
      - name: Sandbox integration tests
        run: go test -shuffle=on -run 'Integration' ./...
        env:
          SPACKLE_REQUIRE_RUNTIME: '1'
