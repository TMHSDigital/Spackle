name: bench

# Manual only. A benchmark run with a hosted model spends real money, so it
# never runs on push. Results are uploaded as an artifact; committing a
# results file to bench/results/ is a separate, reviewed change.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider (leave empty for the deterministic, no-model run)
        required: false
        default: ''
        type: choice
        options: ['', anthropic, openai, openai-compatible]
      model:
        description: Model name
        required: false
        default: ''
      base_url:
        description: Base URL for the openai-compatible provider
        required: false
        default: ''
      budget_usd:
        description: Hard spend cap in USD
        required: false
        default: '5'

permissions: read-all

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27'
      - name: Build
        run: make build
      - name: Run the corpus
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          BASE_URL: ${{ inputs.base_url }}
          BUDGET_USD: ${{ inputs.budget_usd }}
        run: |
          args=(bench --corpus bench/corpus --out bench/results --yes --budget-usd "${BUDGET_USD}")
          if [ -n "${PROVIDER}" ]; then args+=(--provider "${PROVIDER}"); fi
          if [ -n "${MODEL}" ]; then args+=(--model "${MODEL}"); fi
          if [ -n "${BASE_URL}" ]; then args+=(--base-url "${BASE_URL}"); fi
          ./spackle "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench/results/*.json
