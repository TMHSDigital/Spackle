name: tool-versions

# golangci-lint and GoReleaser are pinned in .github/tool-versions.env.
# Dependabot does not read that file, so this job compares each pin with the
# tool's latest release once a week and fails when one is behind.
#
# It does the same for the scanner versions pinned in
# .github/workflows/scanners.yml (GitHub releases, and PyPI for Semgrep),
# so the scanners job does not keep testing old releases.
#
# It also checks the default sandbox images, which are the DefaultImage
# string literals in internal/lang/lang.go and so are invisible to
# Dependabot too: the job
# fails when one of them is within 60 days of its end of life.

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/tool-versions.env
      - .github/workflows/tool-versions.yml
      - .github/workflows/scanners.yml
      - internal/lang/lang.go

permissions: read-all

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare pins with the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . .github/tool-versions.env
          behind=0
          check() {
            latest="$(gh release view --repo "$2" --json tagName --jq .tagName)"
            if [ "$3" = "${latest}" ]; then
              echo "$1 is pinned at $3, the latest release."
            else
              echo "::error file=.github/tool-versions.env::$1 is pinned at $3 and the latest release is ${latest}. Update .github/tool-versions.env."
              behind=1
            fi
          }
          check GOLANGCI_LINT_VERSION golangci/golangci-lint "${GOLANGCI_LINT_VERSION}"
          check GORELEASER_VERSION goreleaser/goreleaser "${GORELEASER_VERSION}"
          exit "${behind}"
      # Each check runs even when an earlier one failed, so one stale pin
      # does not hide another.
      - name: Compare scanner pins with the latest releases
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wf=.github/workflows/scanners.yml
          # pin <NAME>: the value of NAME in the env block of scanners.yml.
          pin() { sed -n "s/^ *$1: *//p" "${wf}" | head -n 1; }
          behind=0
          report() {
            if [ "$2" = "$3" ]; then
              echo "$1 is pinned at $2, the latest release."
            else
              echo "::error file=${wf}::$1 is pinned at $2 and the latest release is $3. Update the version (and its hash) in ${wf}."
              behind=1
            fi
          }
          release() { gh release view --repo "$1" --json tagName --jq .tagName | sed 's/^v//'; }
          report GITLEAKS_VERSION "$(pin GITLEAKS_VERSION)" "$(release gitleaks/gitleaks)"
          report HADOLINT_VERSION "$(pin HADOLINT_VERSION)" "$(release hadolint/hadolint)"
          report OSV_SCANNER_VERSION "$(pin OSV_SCANNER_VERSION)" "$(release google/osv-scanner)"
          report TRIVY_VERSION "$(pin TRIVY_VERSION)" "$(release aquasecurity/trivy)"
          report SEMGREP_VERSION "$(pin SEMGREP_VERSION)" "$(curl -fsSL https://pypi.org/pypi/semgrep/json | jq -r .info.version)"
          exit "${behind}"
      - name: Default sandbox images are not near end of life
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # End-of-life dates of the default sandbox images, from each
          # project's release schedule. Add a line when a default changes.
          eol() {
            case "$1" in
              golang:1.27) echo 2027-08-15 ;;       # until Go 1.29 is released
              python:3.13-slim) echo 2029-10-31 ;;
              node:24-slim) echo 2028-04-30 ;;
              *) echo unknown ;;
            esac
          }
          images="$(grep -o 'DefaultImage: "[^"]*"' internal/lang/lang.go | sed 's/.*"\(.*\)"/\1/' | sort -u)"
          test -n "${images}" || { echo "::error::no default sandbox images were found in internal/lang/lang.go"; exit 1; }
          limit="$(date -u -d '+60 days' +%Y-%m-%d)"
          bad=0
          for image in ${images}; do
            end="$(eol "${image}")"
            if [ "${end}" = unknown ]; then
              echo "::error file=internal/lang/lang.go::default sandbox image ${image} has no end-of-life date in this workflow. Add one."
              bad=1
            elif [[ "${end}" < "${limit}" ]]; then
              echo "::error file=internal/lang/lang.go::default sandbox image ${image} reaches end of life on ${end}. Move the default to a supported release."
              bad=1
            else
              echo "${image} is supported until ${end}."
            fi
          done
          exit "${bad}"
