apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  labels:
    app: notes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notes
  template:
    metadata:
      labels:
        app: notes
    spec:
      containers:
        - name: notes
          image: registry.example.com/notes:latest
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
          securityContext:
            privileged: true
